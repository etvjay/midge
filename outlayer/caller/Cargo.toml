[package]
name = "midge-outlayer-caller"
version = "0.1.0"
edition = "2021"
description = "Proof of concept: a NEAR contract that triggers an OutLayer program (request_execution, NEAR yield/resume) and stores the result its callback receives."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.1.0"

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
