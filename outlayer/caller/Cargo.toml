[package]
name = "midge-outlayer-caller"
version = "0.1.0"
edition = "2021"
description = "Proof of concept: a NEAR contract that triggers an OutLayer program (request_execution, NEAR yield/resume) and stores the result its callback receives."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The unit-testing feature is what makes a refusal reach the caller as its message: built without it, env::panic_str ends in a bare wasm trap (found on chain, 2026-11-11). The coordinator is built the same way.
near-sdk = { version = "5.1.0", features = ["unit-testing"] }

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "warn"
