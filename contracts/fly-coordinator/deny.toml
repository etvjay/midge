# Dependency policy for this crate, checked by cargo-deny in CI.
# advisories: known vulnerabilities in the dependency graph fail the check. bans: several versions of one crate only warn (the NEAR SDK pulls in some).
# licenses: only the permissive licenses below. The crate's own license is not set, so private (unpublished) crates are not checked.

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint timing issues, reached only through near-sdk -> near-vm-runner -> p256. Fixing it means a near-sdk upgrade and a new contract build, which is a gated redeploy (the contract's code hash is recorded in docs/canonical/deployments.json)." },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; reached only through near-sdk -> near-parameters -> serde_yaml. Same fix path as above." },
  { id = "RUSTSEC-2022-0054", reason = "wee_alloc is unmaintained; pulled in by near-sdk. Same fix path as above." },
]

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
