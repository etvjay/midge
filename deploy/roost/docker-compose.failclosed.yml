# TEST FIXTURE, not a deployment: the real compose file with its two escrow providers replaced by hosts that can never resolve (.invalid),
# used by lab experiment E-HOSTED-FAILCLOSED-LIVE-01 to show the Roost refuses a charged round when it cannot read the chain.
# A test checks that it differs from deploy/roost/docker-compose.yml in those two URLs only.
# Compose file for the hosted Roost on a Phala dstack CVM (production image, no shell).
# The image reference must be a digest of a PUSHED image. Its digest becomes part of the compose hash
# that the attestation measures, so editing this file changes the code identity on purpose.
services:
  roost:
    image: ghcr.io/etvjay/midge-roost@sha256:0e1fbad07e8c688097404ea9b5229432b4e92525f49768b85d97934e8ee9d267
    restart: unless-stopped
    environment:
      # Set as an encrypted environment variable in Phala Cloud; only the CVM can decrypt it.
      - ROOST_ADMIN_KEY=${ROOST_ADMIN_KEY}
      - PORT=8080
      # The escrow check, ON, and written here on purpose: this file is measured by the attestation, so a member who verifies the
      # Roost also verifies the provider it must ask (drpc, in plain text) and which contract it reads, and the coordinator cannot switch the check off
      # or point it only elsewhere without changing the Roost's identity. Changing either line is a redeploy.
      # The second provider is a PRIVATE endpoint that carries an API key in its address, so its address is an encrypted environment variable, like the
      # admin key, and is not written here. Every provider must agree before a read counts, so an endpoint that the operator controls can make the room
      # refuse a read but cannot make it accept a false one: the pinned provider would disagree. The free public endpoints this replaced (fastnear) rate
      # limited the room for minutes at a time, on 2026-11-14, and failed visitors' rounds.
      - ROOST_RPC_URLS=https://provider-a.invalid,https://provider-b.invalid
      - ROOST_CONTRACT_ID=c.fly-1793636729.testnet
      # Signed inputs REQUIRED: the room accepts only inputs signed with a key the member's NEAR account really has (checked against the first
      # provider above). Ballots, RFQs and pay runs need this and are refused without it (GAP-046). Measured by the attestation like the lines above.
      - ROOST_REQUIRE_SIGNED_INPUTS=1
      # The providers that must ALL confirm a member's account key before a signed bid is accepted. Separate from the escrow providers above so an outage of one
      # does not silently change the other, and measured by the attestation like them (GAP-050).
      - ROOST_ACCOUNT_CHECK_RPC_URLS=https://near-testnet.drpc.org,${ROOST_PRIVATE_RPC_URL}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
