# TEST FIXTURE, not a deployment: the real compose file with its two escrow providers replaced by hosts that can never resolve (.invalid),
# used by lab experiment E-HOSTED-FAILCLOSED-LIVE-01 to show the Roost refuses a charged round when it cannot read the chain.
# A test checks that it differs from deploy/roost/docker-compose.yml in those two URLs only.
# Compose file for the hosted Roost on a Phala dstack CVM (production image, no shell).
# The image reference must be a digest of a PUSHED image. Its digest becomes part of the compose hash
# that the attestation measures, so editing this file changes the code identity on purpose.
services:
  roost:
    image: ghcr.io/etvjay/midge-roost@sha256:0e09e81646d62f57205b5380922e62a79dc2dc61063dbaa80deeb284de3804d4
    restart: unless-stopped
    environment:
      # Set as an encrypted environment variable in Phala Cloud; only the CVM can decrypt it.
      - ROOST_ADMIN_KEY=${ROOST_ADMIN_KEY}
      - PORT=8080
      # The escrow check, ON, and written here on purpose: this file is measured by the attestation, so a member who verifies the
      # Roost also verifies WHICH providers it asks and which contract it reads, and the coordinator cannot switch it off or point it
      # elsewhere without changing the Roost's identity. Plain text is fine: nothing here is secret. Changing either line is a redeploy.
      - ROOST_RPC_URLS=https://provider-a.invalid,https://provider-b.invalid
      - ROOST_CONTRACT_ID=c.fly-1793636729.testnet
      # Signed inputs REQUIRED: the room accepts only inputs signed with a key the member's NEAR account really has (checked against the first
      # provider above). Ballots, RFQs and pay runs need this and are refused without it (GAP-046). Measured by the attestation like the lines above.
      - ROOST_REQUIRE_SIGNED_INPUTS=1
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
